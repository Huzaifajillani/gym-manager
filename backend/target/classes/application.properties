server.port=${PORT:8080}
spring.application.name=gym-manager

# MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Embedded MongoDB - Disabled by default
gym.mongodb.embedded.enabled=${MONGODB_EMBEDDED_ENABLED:false}

# JWT Security
gym.jwt.secret=${JWT_SECRET}
gym.jwt.expiration-ms=86400000

# WhatsApp Integration
gym.whatsapp.simulated=${WHATSAPP_SIMULATED:true}
gym.whatsapp.api-token=${WHATSAPP_API_TOKEN:}
gym.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}

# Payment Integration (Safepay)
gym.payment.simulated=${PAYMENT_SIMULATED:true}
gym.payment.safepay.api-key=${SAFEPAY_API_KEY:}
gym.payment.safepay.secret-key=${SAFEPAY_SECRET_KEY:}
gym.payment.safepay.env=${SAFEPAY_ENV:sandbox}

# Logging
logging.level.com.gym=INFO
logging.level.org.springframework.data.mongodb=INFO